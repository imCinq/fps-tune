plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

def targetProfile = new Properties()
rootProject.file('gradle/versions/1.21.1-neoforge.properties').withInputStream { targetProfile.load(it) }
def targetProperty = { String name -> targetProfile.getProperty(name) }
def javaLevel = targetProperty('java_version').toInteger()
def metadataProperties = [
        mod_id                  : 'fpstune',
        mod_name                : 'FPS Tune',
        mod_version             : rootProject.property('mod_version').toString(),
        mod_license             : 'MIT',
        minecraft_version       : targetProperty('minecraft_version'),
        minecraft_version_range : targetProperty('minecraft_version_range'),
        neo_version             : targetProperty('neoforge_version'),
        loader_version_range    : targetProperty('loader_version_range')
]

version = rootProject.property('mod_version')
group = rootProject.property('maven_group')

base {
    archivesName = 'fps-tune-neoforge-1.21.1'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = [
                    rootProject.file('src/main/java'),
                    rootProject.file('src/1.21.1/java'),
                    rootProject.file('src/1.21.1-neoforge/java')
            ]
            def excludedRootJavaSources = [
                    'dev/fpstune/integration/ModMenuIntegration.java',
                    'dev/fpstune/screen/FPSTuneConfigScreen.java',
                    'dev/fpstune/screen/FPSTuneAdvancedConfigScreen.java',
                    'dev/fpstune/screen/FPSTuneSettingsIcons.java'
            ]
            def excludedFabricBridgeSources = [
                    'dev/fpstune/FPSTuneClient.java',
                    'dev/fpstune/FPSTuneHud.java',
                    'dev/fpstune/mixin/LevelRendererMixin.java'
            ]
            exclude { details ->
                def normalized = details.file.toPath().normalize()
                (normalized.startsWith(rootProject.file('src/main/java').toPath().normalize())
                        && excludedRootJavaSources.any {
                            normalized == rootProject.file("src/main/java/${it}").toPath().normalize()
                        }) || (normalized.startsWith(rootProject.file('src/1.21.1/java').toPath().normalize())
                        && excludedFabricBridgeSources.any {
                            normalized == rootProject.file("src/1.21.1/java/${it}").toPath().normalize()
                        })
            }
        }
        resources {
            srcDirs = [
                    rootProject.file('src/main/resources'),
                    rootProject.file('src/1.21.1-neoforge/resources')
            ]
        }
    }
    test {
        java {
            srcDirs = [rootProject.file('src/test/java')]
            exclude 'dev/fpstune/screen/FPSTuneConfigScreenTest.java'
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaLevel)
    withSourcesJar()
}

neoForge {
    version = targetProperty('neoforge_version')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'fpstune'
        }
    }

    mods {
        fpstune {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${rootProject.property('junit_version')}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources') {
    inputs.properties(metadataProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(metadataProperties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaLevel
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE_fps-tune' }
    }
}
