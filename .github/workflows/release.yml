name: v1.3.0 release build

on:
  pull_request:
  push:
    tags:
      - 'v*'
      - '!v*-mc1.21.1'
      - '!v*-mc26.3'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-stage:
    name: Build and verify the four release targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify project version
        run: |
          set -euo pipefail
          project_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test -n "$project_version"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF_NAME" = "v$project_version"
          fi

      - name: Verify release tag provenance
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          tag_commit=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$tag_commit" origin/main
          commit_verified=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_commit" --jq '.commit.verification.verified')
          test "$commit_verified" = "true"

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and audit Fabric 26.3 and NeoForge 26.3
        run: |
          set -euo pipefail
          ./gradlew :clean :build --no-daemon -Pmc_target=26.3
          ./scripts/audit-client-only.sh 26.3
          project_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          mkdir -p release
          cp "build/libs/fps-tune-mc26.3-$project_version.jar" release/
          cp "build/libs/fps-tune-mc26.3-$project_version-sources.jar" release/
          ./gradlew :neoforge-26.3:clean :neoforge-26.3:build --no-daemon
          ./scripts/audit-client-only.sh 26.3-neoforge

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and audit Fabric 1.21.11 and NeoForge 1.21.11
        run: |
          set -euo pipefail
          ./gradlew :clean :build --no-daemon -Pmc_target=1.21.11
          ./scripts/audit-client-only.sh 1.21.11
          project_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          cp "build/libs/fps-tune-mc1.21.11-$project_version.jar" release/
          cp "build/libs/fps-tune-mc1.21.11-$project_version-sources.jar" release/
          ./gradlew :neoforge-1.21.11:clean :neoforge-1.21.11:build --no-daemon
          ./scripts/audit-client-only.sh 1.21.11-neoforge
          ./scripts/audit-repository.sh

      - name: Verify and checksum exact release files
        run: |
          set -euo pipefail
          project_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          mkdir -p release

          fabric_26_3="release/fps-tune-mc26.3-$project_version.jar"
          fabric_26_3_sources="release/fps-tune-mc26.3-$project_version-sources.jar"
          neoforge_26_3="neoforge-26.3/build/libs/fps-tune-neoforge-26.3-$project_version.jar"
          neoforge_26_3_sources="neoforge-26.3/build/libs/fps-tune-neoforge-26.3-$project_version-sources.jar"
          fabric_1_21_11="release/fps-tune-mc1.21.11-$project_version.jar"
          fabric_1_21_11_sources="release/fps-tune-mc1.21.11-$project_version-sources.jar"
          neoforge_1_21_11="neoforge-1.21.11/build/libs/fps-tune-neoforge-1.21.11-$project_version.jar"
          neoforge_1_21_11_sources="neoforge-1.21.11/build/libs/fps-tune-neoforge-1.21.11-$project_version-sources.jar"

          for file in "$fabric_26_3" "$fabric_26_3_sources" "$neoforge_26_3" "$neoforge_26_3_sources" "$fabric_1_21_11" "$fabric_1_21_11_sources" "$neoforge_1_21_11" "$neoforge_1_21_11_sources"; do
            if [[ ! -f "$file" ]]; then
              echo "Required release input is missing: $file" >&2
              exit 1
            fi
            echo "Staging $file"
            if [[ "$file" != release/* ]]; then
              cp "$file" release/
            fi
          done

          verify_fabric() {
            local jar="$1" mc="$2" java_floor="$3" metadata
            echo "Verifying Fabric metadata: $jar"
            if ! metadata=$(unzip -p "$jar" fabric.mod.json) ||
              ! jq -e --arg version "$project_version" --arg mc "$mc" --arg java_floor "$java_floor" '
                .id == "fpstune" and
                .version == $version and
                .environment == "client" and
                .depends.minecraft == $mc and
                .depends.java == (">=" + $java_floor) and
                .icon == "assets/fpstune/icon.png"
              ' <<<"$metadata" >/dev/null; then
              echo "Fabric metadata validation failed for $jar" >&2
              unzip -p "$jar" fabric.mod.json >&2 || true
              exit 1
            fi
            unzip -p "$jar" assets/fpstune/icon.png >/dev/null
            unzip -p "$jar" fpstune.mixins.json | jq -e '.required == true' >/dev/null
            echo "Verified Fabric metadata: $jar"
          }

          require_neoforge_metadata() {
            local metadata="$1" expected="$2" label="$3"
            if ! grep -Fq -- "$expected" <<<"$metadata"; then
              echo "NeoForge metadata for $label is missing: $expected" >&2
              printf '%s\n' "$metadata" >&2
              exit 1
            fi
          }

          verify_neoforge() {
            local jar="$1" mc="$2" loader="$3" metadata
            echo "Verifying NeoForge metadata: $jar"
            metadata=$(unzip -p "$jar" META-INF/neoforge.mods.toml)
            require_neoforge_metadata "$metadata" "version=\"$project_version\"" "$jar"
            require_neoforge_metadata "$metadata" "versionRange=\"[$loader,)\"" "$jar"
            require_neoforge_metadata "$metadata" "versionRange=\"[$mc]\"" "$jar"
            unzip -p "$jar" assets/fpstune/icon.png >/dev/null
            unzip -p "$jar" fpstune.mixins.json >/dev/null
            if unzip -l "$jar" | grep -Fq "fabric.mod.json"; then
              echo "NeoForge artifact contains Fabric metadata: $jar" >&2
              exit 1
            fi
            echo "Verified NeoForge metadata: $jar"
          }

          verify_fabric "release/$(basename "$fabric_26_3")" "26.3" "25"
          verify_neoforge "release/$(basename "$neoforge_26_3")" "26.3" "26.3.0.7-beta"
          verify_fabric "release/$(basename "$fabric_1_21_11")" "1.21.11" "21"
          verify_neoforge "release/$(basename "$neoforge_1_21_11")" "1.21.11" "21.11.45"

          jar_count=$(find release -maxdepth 1 -type f -name '*.jar' | wc -l | tr -d '[:space:]')
          if [[ "$jar_count" != "8" ]]; then
            echo "Expected eight JAR files (four runtime and four sources); found $jar_count" >&2
            find release -maxdepth 1 -type f -print >&2
            exit 1
          fi
          (
            cd release
            sha256sum *.jar > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload release files for draft staging
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fps-tune-release-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  create-draft-release:
    name: Create non-public draft release
    if: github.event_name == 'push'
    needs: build-and-stage
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified files from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$GITHUB_RUN_ID" --name "fps-tune-release-$GITHUB_REF_NAME" --dir release
          (
            cd release
            sha256sum -c SHA256SUMS.txt
          )

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/*.jar release/SHA256SUMS.txt \
            --verify-tag \
            --draft \
            --latest=false \
            --generate-notes \
            --title "FPS Tune $version"
