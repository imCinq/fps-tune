name: Release Minecraft 1.21.1

on:
  push:
    tags:
      - 'v*-mc1.21.1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    name: Build and publish Minecraft 1.21.1 release
    environment:
      name: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          tag_commit=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$tag_commit" "origin/main"
          commit_verified=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag_commit}" --jq '.commit.verification.verified')
          test "$commit_verified" = "true"

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify target tag and project version
        run: |
          project_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "v${project_version}-mc1.21.1"

      - name: Build Minecraft 1.21.1 artifact and audit
        run: |
          mkdir -p release
          ./gradlew clean build --no-daemon -Pmc_target=1.21.1
          cp build/libs/fps-tune-mc1.21.1-*.jar release/
          ./scripts/audit-client-only.sh 1.21.1
          ./scripts/audit-repository.sh

      - name: Prepare release files
        run: |
          cd release
          sha256sum *.jar > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%-mc1.21.1}"
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "FPS Tune $version for Minecraft 1.21.1"

  promote:
    if: github.event_name == 'workflow_dispatch'
    name: Promote verified 1.21.1 assets into v1.1.1
    environment:
      name: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download and verify source releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target-assets full-assets release
          gh release download "v1.1.1-mc1.21.1" \
            --repo "$GITHUB_REPOSITORY" \
            --dir target-assets \
            --pattern '*.jar'
          gh release download "v1.1.1-mc1.21.1" \
            --repo "$GITHUB_REPOSITORY" \
            --dir target-assets \
            --pattern 'SHA256SUMS.txt'
          (cd target-assets && sha256sum -c SHA256SUMS.txt)

          gh release download "v1.1.1" \
            --repo "$GITHUB_REPOSITORY" \
            --dir full-assets \
            --pattern '*.jar'
          gh release download "v1.1.1" \
            --repo "$GITHUB_REPOSITORY" \
            --dir full-assets \
            --pattern 'SHA256SUMS.txt'
          (cd full-assets && sha256sum -c SHA256SUMS.txt)

          cp full-assets/*.jar release/
          cp target-assets/*.jar release/
          (cd release && sha256sum *.jar > SHA256SUMS.txt)

      - name: Attach all target artifacts to v1.1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v1.1.1" release/* --repo "$GITHUB_REPOSITORY" --clobber
