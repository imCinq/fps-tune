name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.mc_target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc_target: '1.21.1'
            java_version: '21'
          - mc_target: '1.21.11'
            java_version: '21'
          - mc_target: '26.2'
            java_version: '25'
          - mc_target: '26.3'
            java_version: '25'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java_version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        run: ./gradlew :clean :build --no-daemon -Pmc_target=${{ matrix.mc_target }}

      - name: Inspect Minecraft 26.3 mixin targets
        if: always() && matrix.mc_target == '26.3'
        run: |
          mkdir -p "${{ runner.temp }}/compatibility-evidence"
          find "$HOME/.gradle/caches" .gradle -type f -name '*.jar' 2>/dev/null | while IFS= read -r candidate; do
            if [[ "$(unzip -p "$candidate" version.json 2>/dev/null | jq -r '.id' 2>/dev/null)" == '26.3' ]] && jar tf "$candidate" 2>/dev/null | grep -qx 'net/minecraft/client/particle/ParticleEngine.class'; then
              basename "$candidate" > ${{ runner.temp }}/compatibility-evidence/minecraft-jar.txt
              unzip -p "$candidate" version.json > ${{ runner.temp }}/compatibility-evidence/version.json
              sha256sum "$candidate" | cut -d " " -f 1 > ${{ runner.temp }}/compatibility-evidence/minecraft-jar.sha256
              javap -classpath "$candidate" -p -c -s 'com.mojang.blaze3d.platform.InputConstants$Type' > ${{ runner.temp }}/compatibility-evidence/InputType.txt
              javap -classpath "$candidate" -p -c -s net.minecraft.client.particle.ParticleEngine > ${{ runner.temp }}/compatibility-evidence/ParticleEngine.txt
              javap -classpath "$candidate" -p -c -s net.minecraft.client.renderer.WeatherEffectRenderer > ${{ runner.temp }}/compatibility-evidence/WeatherEffectRenderer.txt
              javap -classpath "$candidate" -p -c -s net.minecraft.client.renderer.LevelRenderer > ${{ runner.temp }}/compatibility-evidence/LevelRenderer.txt
              javap -classpath "$candidate" -p -c -s net.minecraft.client.particle.TrackingEmitter > "${{ runner.temp }}/compatibility-evidence/TrackingEmitter.txt"
              break
            fi
          done
          test -s ${{ runner.temp }}/compatibility-evidence/ParticleEngine.txt
          jq -e '.id == "26.3"' ${{ runner.temp }}/compatibility-evidence/version.json

      - name: Upload Minecraft 26.3 compatibility evidence
        if: always() && matrix.mc_target == '26.3'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minecraft-26.3-compatibility-evidence
          path: ${{ runner.temp }}/compatibility-evidence/
          if-no-files-found: warn
          retention-days: 14


      - name: Inspect Minecraft 1.21.11 mixin targets
        if: always() && matrix.mc_target == '1.21.11'
        run: |
          mkdir -p ${{ runner.temp }}/compatibility-evidence-1.21.11
          find "$HOME/.gradle/caches" .gradle -type f -name '*.jar' 2>/dev/null | while IFS= read -r candidate; do
            if [[ "$(unzip -p "$candidate" version.json 2>/dev/null | jq -r '.id' 2>/dev/null)" == '1.21.11' ]] && jar tf "$candidate" 2>/dev/null | grep -qx 'net/minecraft/client/particle/ParticleEngine.class' && jar tf "$candidate" 2>/dev/null | grep -qx 'net/minecraft/client/renderer/WeatherEffectRenderer.class'; then
              basename "$candidate" > ${{ runner.temp }}/compatibility-evidence-1.21.11/minecraft-jar.txt
              unzip -p "$candidate" version.json > ${{ runner.temp }}/compatibility-evidence-1.21.11/version.json
              sha256sum "$candidate" | cut -d " " -f 1 > ${{ runner.temp }}/compatibility-evidence-1.21.11/minecraft-jar.sha256
              javap -classpath "$candidate" -p -c -s 'com.mojang.blaze3d.platform.InputConstants$Type' > ${{ runner.temp }}/compatibility-evidence-1.21.11/InputType.txt
              javap -classpath "$candidate" -p -c -s net.minecraft.client.particle.ParticleEngine > ${{ runner.temp }}/compatibility-evidence-1.21.11/ParticleEngine.txt
              javap -classpath "$candidate" -p -c -s net.minecraft.client.renderer.WeatherEffectRenderer > ${{ runner.temp }}/compatibility-evidence-1.21.11/WeatherEffectRenderer.txt
              break
            fi
          done
          test -s ${{ runner.temp }}/compatibility-evidence-1.21.11/ParticleEngine.txt
          test -s ${{ runner.temp }}/compatibility-evidence-1.21.11/WeatherEffectRenderer.txt
          jq -e '.id == "1.21.11"' ${{ runner.temp }}/compatibility-evidence-1.21.11/version.json

      - name: Upload Minecraft 1.21.11 compatibility evidence
        if: always() && matrix.mc_target == '1.21.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: minecraft-1.21.11-compatibility-evidence
          path: ${{ runner.temp }}/compatibility-evidence-1.21.11/
          if-no-files-found: warn
          retention-days: 14

      - name: Audit client-only boundaries
        run: ./scripts/audit-client-only.sh ${{ matrix.mc_target }}

      - name: Audit repository privacy
        run: ./scripts/audit-repository.sh

      - name: Prepare verified artifacts
        run: |
          mkdir -p ci-artifacts
          cp build/libs/fps-tune-*.jar ci-artifacts/
          cd ci-artifacts
          sha256sum *.jar > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fps-tune-minecraft-${{ matrix.mc_target }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14

  build-neoforge:
    name: Build and test (26.2 NeoForge)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        run: ./gradlew :neoforge-26.2:clean :neoforge-26.2:build --no-daemon

      - name: Verify packaged NeoForge metadata
        run: |
          artifact=$(find neoforge-26.2/build/libs -type f -name "fps-tune-neoforge-26.2-*.jar" ! -name "*-sources.jar" -print -quit)
          test -n "$artifact"
          expected_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test -n "$expected_version"
          unzip -p "$artifact" META-INF/neoforge.mods.toml | grep -Fq "version=\"$expected_version\""
          unzip -p "$artifact" META-INF/neoforge.mods.toml | grep -Fq "logoFile=\"assets/fpstune/icon.png\""
          unzip -l "$artifact" | grep -Fq "assets/fpstune/icon.png"
          ! unzip -l "$artifact" | grep -Fq "fabric.mod.json"

      - name: Audit client-only boundaries
        run: ./scripts/audit-client-only.sh 26.2-neoforge

      - name: Audit repository privacy
        run: ./scripts/audit-repository.sh

      - name: Prepare verified artifacts
        run: |
          mkdir -p ci-artifacts
          cp neoforge-26.2/build/libs/fps-tune-neoforge-26.2-*.jar ci-artifacts/
          cd ci-artifacts
          sha256sum *.jar > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fps-tune-minecraft-26.2-neoforge
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14

