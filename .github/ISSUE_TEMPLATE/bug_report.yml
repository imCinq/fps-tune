name: Bug report
description: Report a reproducible problem in FPS Tune.
title: '[Bug] '
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include Minecraft, Fabric Loader, Fabric API, Java, and mod versions.
      placeholder: Minecraft 26.2, Fabric Loader 0.19.3, Java 25, mod 1.0.0
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Problem category
      options:
        - Crash or startup failure
        - Visual regression
        - Performance or frame-time regression
        - Configuration or Mod Menu
        - Compatibility with another mod
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the expected and actual behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start the game with...
        2. Open or enable...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Relevant mod list
      description: Include FPS Tune, Fabric API, Mod Menu, and any rendering or performance mods involved. A pasted launcher export is useful.
      placeholder: |
        fps-tune-1.0.0.jar
        fabric-api-...jar
        modmenu-...jar
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: FPS Tune configuration
      description: Paste the relevant config values. Remove private paths, server addresses, coordinates, and personal information.
      render: properties

  - type: textarea
    id: performance
    attributes:
      label: Performance context
      description: For performance reports, include the scenario, render distance, shaders/resource packs, measurement method, and before/after numbers if available.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
      description: Remove tokens, private server addresses, coordinates, and personal information.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this without unrelated cheat, macro, or automation mods.
          required: true
        - label: I removed private information from the report.
          required: true
