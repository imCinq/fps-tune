name: Feature request
description: Propose a focused client-side improvement.
title: '[Feature] '
labels: [enhancement]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Target mod
      options:
        - Mac Metrics
        - CoreTune
        - Repository or build tooling
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the practical problem rather than only the proposed implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Trust boundaries
      options:
        - label: This does not require telemetry or custom networking.
          required: true
        - label: This does not add packet, combat, movement, inventory, targeting, or click automation.
          required: true
