plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

def targetProfile = new Properties()
rootProject.file('gradle/versions/26.2-neoforge.properties').withInputStream { targetProfile.load(it) }
def targetProperty = { String name -> targetProfile.getProperty(name) }
def javaLevel = targetProperty('java_version').toInteger()
def metadataProperties = [
        mod_id                 : 'fpstune',
        mod_name               : 'FPS Tune',
        mod_version             : rootProject.property('mod_version').toString(),
        mod_license             : 'MIT',
        minecraft_version      : targetProperty('minecraft_version'),
        minecraft_version_range: targetProperty('minecraft_version_range'),
        neo_version            : targetProperty('neoforge_version')
]

version = rootProject.property('mod_version')
group = rootProject.property('maven_group')

base {
    archivesName = 'fps-tune-neoforge-26.2'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = [
                    rootProject.file('src/main/java'),
                    rootProject.file('src/26.2-neoforge/java')
            ]
            exclude 'dev/fpstune/integration/ModMenuIntegration.java'
        }
        resources {
            srcDirs = [
                    rootProject.file('src/main/resources'),
                    rootProject.file('src/26.2-neoforge/resources')
            ]
        }
    }
    test {
        java {
            srcDirs = [rootProject.file('src/test/java')]
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaLevel)
    withSourcesJar()
}

neoForge {
    version = targetProperty('neoforge_version')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'fpstune'
        }
    }

    mods {
        fpstune {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation platform("org.junit.jupiter:junit-bom:${rootProject.property('junit_version')}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources') {
    inputs.properties(metadataProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(metadataProperties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaLevel
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE_fps-tune' }
    }
}
