buildscript {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		mavenCentral()
	}
	dependencies {
		def target = project.findProperty("mc_target") ?: "26.2"
		def profile = new Properties()
		file("gradle/versions/${target}.properties").withInputStream { profile.load(it) }
		classpath "net.fabricmc:fabric-loom:${profile.getProperty("loom_version")}"
	}
}

plugins {
	id "maven-publish"
}

def targetMinecraft = providers.gradleProperty("mc_target").orElse("26.2").get()
apply plugin: targetMinecraft.startsWith("1.")
		? "net.fabricmc.fabric-loom-remap"
		: "net.fabricmc.fabric-loom"

def targetProfile = new Properties()
def targetProfileFile = file("gradle/versions/${targetMinecraft}.properties")
if (!targetProfileFile.isFile()) {
	throw new GradleException("Unsupported mc_target '${targetMinecraft}'. Expected a profile in gradle/versions/.")
}
targetProfileFile.withInputStream { targetProfile.load(it) }
def targetProperty = { String name -> targetProfile.getProperty(name) }
def javaLevel = targetProperty("java_version").toInteger()
def usesLegacyModConfigurations = targetProperty("uses_legacy_mod_configurations").toBoolean()

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}${targetProperty("archive_suffix")}"
}

repositories {
	// Fabric Loom adds the Minecraft repositories needed by the toolchain.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${targetProperty("minecraft_version")}"
	if (usesLegacyModConfigurations) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${targetProperty("loader_version")}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${targetProperty("fabric_api_version")}"
		modCompileOnly "com.terraformersmc:modmenu:${targetProperty("modmenu_version")}"
		modRuntimeOnly "com.terraformersmc:modmenu:${targetProperty("modmenu_version")}"
	} else {
		implementation "net.fabricmc:fabric-loader:${targetProperty("loader_version")}"
		implementation "net.fabricmc.fabric-api:fabric-api:${targetProperty("fabric_api_version")}"
		compileOnly "com.terraformersmc:modmenu:${targetProperty("modmenu_version")}"
		runtimeOnly "com.terraformersmc:modmenu:${targetProperty("modmenu_version")}"
	}
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sourceSets {
	main {
		java {
			srcDirs = ["src/main/java"]
			def targetJavaDirectory = targetProperty("source_directory") + "/java"
			if (targetJavaDirectory != "src/main/java") {
				srcDir targetJavaDirectory
			}
			targetProperty("excluded_root_java_sources").split(",").findAll { !it.isBlank() }.each {
				exclude it
			}
		}
		resources {
			def targetResourceDirectory = targetProperty("source_directory") + "/resources"
			srcDirs = ["src/main/resources", targetResourceDirectory]
			targetProperty("excluded_root_resources").split(",").findAll { !it.isBlank() }.each {
				exclude it
			}
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand version: project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaLevel
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(javaLevel)
	targetCompatibility = JavaVersion.toVersion(javaLevel)
}

tasks.named("test") {
	useJUnitPlatform()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
		// Add a publishing repository here when you are ready to publish.
	}
}
